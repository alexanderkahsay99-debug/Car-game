<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D የመኪና መንዳት</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui,Arial;color:white;touch-action:none}canvas{display:block}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 4px #000} .panel{background:#101820d9;border:1px solid #ffffff55;border-radius:12px;padding:10px 14px;font-weight:700}.small{font-size:12px;opacity:.8}#controls{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 16px;gap:12px}button{color:#fff;background:#18232ddd;border:2px solid #ffffff99;border-radius:18px;font-weight:800;box-shadow:0 4px 12px #0005;touch-action:none;user-select:none}#wheel{width:100px;height:100px;border-radius:50%;font-size:38px}#pedals{display:flex;gap:10px;align-items:end} .pedal{width:76px;height:105px;font-size:15px}.pedal.brake{height:84px;background:#8c2424e8}.pedal.gas{background:#17733be8}#hint{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:#111a;padding:7px 12px;border-radius:9px;font-size:12px;white-space:nowrap}#reset{position:fixed;right:14px;top:85px;padding:9px 12px;pointer-events:auto} @media(min-width:800px){#wheel{width:120px;height:120px}.pedal{width:90px;height:120px}}
</style>
</head>
<body>
<div id="hud"><div class="panel">🚘 3D ድራይቪንግ<br><span class="small">CITY DRIVE</span></div><div class="panel"><span id="speed">0</span> km/h<br><span class="small">ፍጥነት</span></div></div>
<div id="hint">ስቲሪንግ አዙር • ጋዝ ጫን • ብሬክ ጫን</div><button id="reset">↻ እንደገና</button>
<div id="controls"><button id="wheel" aria-label="steering">◉</button><div id="pedals"><button class="pedal brake" id="brake">BRAKE<br>🛑</button><button class="pedal gas" id="gas">GAS<br>▲</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,70,240);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);camera.position.set(0,5,10);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x63715b,2));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-10,20,10);sun.castShadow=true;scene.add(sun);
const mat=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const roadMat=mat(0x33383e),lineMat=mat(0xffffff),grassMat=mat(0x43864a),trunkMat=mat(0x68452d),leafMat=mat(0x24723a),buildingMats=[0x9aa8b5,0xd2c4ae,0x7c929e,0xb5b9c0].map(c=>mat(c));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),grassMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.12;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(12,500),roadMat);road.rotation.x=-Math.PI/2;road.position.set(0,0,-170);scene.add(road);
for(let z=70;z>-420;z-=10){const stripe=new THREE.Mesh(new THREE.BoxGeometry(.16,.025,4.5),lineMat);stripe.position.set(0,.025,z);scene.add(stripe)}
for(const x of [-6.1,6.1]){const edge=new THREE.Mesh(new THREE.BoxGeometry(.12,.03,500),lineMat);edge.position.set(x,.02,-170);scene.add(edge)}
// City buildings and roadside trees
for(let z=50;z>-400;z-=18){for(const side of [-1,1]){let x=side*(10+Math.random()*13);let h=7+Math.random()*22,w=5+Math.random()*6;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),buildingMats[Math.floor(Math.random()*buildingMats.length)]);b.position.set(x,h/2,z-Math.random()*8);scene.add(b);for(let yy=2;yy<h-1;yy+=2.4)for(let xx=-w/2+1;xx<w/2;xx+=2){const win=new THREE.Mesh(new THREE.BoxGeometry(.7,.9,.05),mat(0x8dd9f5,.3));win.position.set(x+xx,yy,b.position.z+w/2+.03);scene.add(win)}
const tx=side*(7.7);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,2,7),trunkMat);trunk.position.set(tx,1,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.4,8,7),leafMat);crown.position.set(tx,3,z);scene.add(crown)}}
// Car body in front of camera, with visible wheels
const car=new THREE.Group();scene.add(car);const body=new THREE.Mesh(new THREE.BoxGeometry(1.8,.65,3.4),mat(0xc62828,.35));body.position.y=.72;car.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.65,.28,1.1),mat(0xe53935,.35));hood.position.set(0,1.08,-.9);car.add(hood);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.35,.68,1.45),mat(0x8dd6e9,.25));cabin.position.set(0,1.28,.45);car.add(cabin);const bumper=new THREE.Mesh(new THREE.BoxGeometry(1.85,.2,.2),mat(0x222222));bumper.position.set(0,.45,-1.72);car.add(bumper);
const tireMat=mat(0x17191b),rimMat=mat(0xbfc6cb,.3);for(const x of [-.96,.96])for(const z of [-1.05,1.05]){const t=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.22,16),tireMat);t.rotation.z=Math.PI/2;t.position.set(x,.4,z);car.add(t);const rim=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.235,12),rimMat);rim.rotation.z=Math.PI/2;rim.position.set(x*1.01,.4,z);car.add(rim)}
car.position.set(0,0,2.5);
// A few cars ahead
for(let i=0;i<5;i++){const g=new THREE.Group();const c=new THREE.Mesh(new THREE.BoxGeometry(1.7,.8,3),mat([0x1565c0,0xf9a825,0xeeeeee,0x00897b][i%4]));c.position.y=.65;g.add(c);const top=new THREE.Mesh(new THREE.BoxGeometry(1.3,.55,1.25),mat(0x8ed9ed,.3));top.position.set(0,1.25,.2);g.add(top);g.position.set((Math.random()-.5)*5,-.02,-25-i*35);scene.add(g)}
let throttle=0,braking=false,steer=0,speed=0,offset=0,wheelAngle=0;const speedEl=document.getElementById('speed');
function hold(id,down,up){const e=document.getElementById(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();e.setPointerCapture(ev.pointerId);down()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])e.addEventListener(ev,up)}
hold('gas',()=>throttle=1,()=>throttle=0);hold('brake',()=>braking=true,()=>braking=false);
let steerLeft=false,steerRight=false;hold('wheel',()=>{steerLeft=true;steerRight=false},()=>{steerLeft=false;steerRight=false});document.getElementById('wheel').addEventListener('contextmenu',e=>e.preventDefault());
// Drag left/right on steering wheel for smooth steering
const wheel=document.getElementById('wheel');let lastX=null;wheel.addEventListener('pointerdown',e=>{lastX=e.clientX});wheel.addEventListener('pointermove',e=>{if(lastX!==null){steer=Math.max(-1,Math.min(1,steer+(e.clientX-lastX)*.018));lastX=e.clientX}});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>wheel.addEventListener(ev,()=>{lastX=null;steerLeft=false}));
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')throttle=1;if(e.key==='ArrowDown'||e.key==='s')braking=true;if(e.key==='ArrowLeft'||e.key==='a')steer=-1;if(e.key==='ArrowRight'||e.key==='d')steer=1});addEventListener('keyup',e=>{if(['ArrowUp','w'].includes(e.key))throttle=0;if(['ArrowDown','s'].includes(e.key))braking=false;if(['ArrowLeft','a','ArrowRight','d'].includes(e.key))steer=0});
document.getElementById('reset').onclick=()=>{speed=0;offset=0;steer=0;car.position.x=0;car.rotation.y=0;};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);speed+=throttle*24*dt;speed-= (braking?55:8)*dt;speed=Math.max(0,Math.min(160,speed));offset+=speed/3.6*dt;car.position.x+=steer*speed/160*8*dt;car.position.x=Math.max(-4.5,Math.min(4.5,car.position.x));car.rotation.y=-steer*.12;speedEl.textContent=Math.round(speed);
// Move road markings and city toward player to simulate driving
scene.children.forEach(o=>{if(o.userData.moving){o.position.z+=speed/3.6*dt;if(o.position.z>12)o.position.z-=450}});
// Scroll the scenery and lane dashes
scene.traverse(o=>{if(o.userData.scroll){o.position.z+=speed/3.6*dt;if(o.position.z>8)o.position.z-=450}});
// camera follows the car, looking down the road
camera.position.x+=(car.position.x*.65-camera.position.x)*.08;camera.position.y=4.2;camera.position.z=8;camera.lookAt(car.position.x*.5,1,-14);renderer.render(scene,camera)}
// Mark road dashes and roadside objects to loop as the car advances
scene.children.forEach(o=>{if(o.position.z<70&&o.position.z>-430)o.userData.scroll=true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate();
})();
</script>
</body></html>
